wall_follower_node:
  ros__parameters:
    target_distance: 0.5      # Расстояние до стенки (м)
    linear_speed: 0.15        # Линейная скорость (м/с) — ограничено maxVelocity=6.67 рад/с колеса
    follow_side: right        # Сторона следования: left или right
    max_linear_speed: 0.25    # Максимальная линейная скорость (м/с)
    max_angular_speed: 0.6    # Максимальная угловая скорость (рад/с) — (0.15+0.6*0.08)/0.033=6.0<6.67
    min_front_clearance: 0.35 # Минимальный безопасный зазор спереди (м)
    search_rotate_speed: 0.4  # Скорость вращения при поиске стены (рад/с)
    side_sector_half_width_deg: 45.0  # Полуширина бокового сектора (итого 90°)
    front_check_half_width_deg: 20.0  # Полуширина переднего сектора препятствий
    kp: 0.5                   # Пропорциональный коэффициент (снижено для уменьшения перерегулирования)
    ki: 0.0                   # Интегральный коэффициент (отключён до стабилизации)
    kd: 0.95                  # Дифференциальный коэффициент (увеличено для гашения колебаний)
